# Builds a standalone zenode-monitor binary for Linux (x86_64, arm64), Windows and macOS (arm64).
#
#   merge into main with a new version in pyproject.toml
#                           -> build all targets, tag v<version>, create a GitHub release
#   push a tag like v0.1.0  -> the same, for that tag (it must match pyproject.toml)
#   "Run workflow" button   -> build only; the archives are kept as workflow artifacts
# A push to main whose version already has a tag builds nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare the project version with the existing tags
        id: decide
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            release=false
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)"
              exit 1
            fi
            release=true
          elif ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            release=true
          else
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag, release: $release"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the binary also starts on older distributions.
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x86_64 }
          # macos-latest is Apple Silicon.
          - { os: macos-latest, target: macos-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        if: runner.os == 'Linux'
        run: uv run pytest -q

      - name: Work around a flet pack bug on Windows
        # flet 1.1.2 opens the client .exe with open(path, "ab", encoding="utf-8"),
        # which Python rejects. Does nothing once flet no longer contains that call.
        if: runner.os == 'Windows'
        run: |
          uv run python - <<'EOF'
          import importlib.util, pathlib
          root = list(importlib.util.find_spec("flet_cli").submodule_search_locations)[0]
          path = pathlib.Path(root) / "__pyinstaller" / "win_utils.py"
          src = path.read_text(encoding="utf-8")
          fixed = src.replace('open(exe_path, "ab", encoding="utf-8")', 'open(exe_path, "ab")')
          path.write_text(fixed, encoding="utf-8")
          print("patched" if fixed != src else "nothing to patch", path)
          EOF

      - name: Package
        # zenode reads its own version from package metadata at import, so the
        # metadata has to be bundled or the binary crashes on start.
        run: >
          uv run --with pyinstaller flet pack src/zenode_monitor/main.py
          --name zenode-monitor --yes
          --pyinstaller-build-args=--copy-metadata=zenode

      - name: Archive
        id: archive
        env:
          LABEL: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.tag || github.ref_name }}
        run: |
          name="zenode-monitor-${LABEL//\//-}-${{ matrix.target }}"
          ls -la dist
          case "$RUNNER_OS" in
            Linux)
              tar -czf "$name.tar.gz" -C dist zenode-monitor
              echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT" ;;
            Windows)
              7z a "$name.zip" ./dist/zenode-monitor.exe
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            macOS)
              # ditto keeps the .app bundle's permissions and symlinks intact
              ditto -c -k --keepParent dist/zenode-monitor.app "$name.zip"
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: zenode-monitor-${{ matrix.target }}
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        # Creates the tag on this commit when it does not exist yet (a merge into main).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
